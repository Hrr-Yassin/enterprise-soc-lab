<g font-family="system-ui, sans-serif" fill="#F8FAFC" font-size="15"><text x="35" y="38" fill="#38BDF8" font-weight="700">PROPOSED COMPONENT FLOW</text>
<path d="M128 114V128H482V121" fill="none" stroke="#38BDF8" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="305" y="124" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">agent telemetry</text>
<path d="M315 114V156H482V121" fill="none" stroke="#38BDF8" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="398.5" y="152" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">EVE JSON</text>
<path d="M502 114V184H669V121" fill="none" stroke="#38BDF8" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="585.5" y="180" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">normalized events</text>
<path d="M689 114V212H856V121" fill="none" stroke="#38BDF8" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="772.5" y="208" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">alerts and provenance</text>
<g><rect x="35" y="64" width="166" height="50" rx="9" fill="#172235" stroke="#38BDF8"/><text x="118" y="94" text-anchor="middle">Windows and Linux</text></g>
