<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 983 257" role="img" aria-labelledby="title detail"><title id="title">Enterprise SOC &amp; Detection Engineering Lab component flow</title><desc id="detail">Windows and Linux to Wazuh manager via agent telemetry. Suricata sensor to Wazuh manager via EVE JSON. Wazuh manager to Indexer / dashboard via normalized events. Indexer / dashboard to Analyst case via alerts and provenance.</desc>
