<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" role="img" aria-labelledby="title detail">
  <title id="title">Enterprise SOC lab deployment and telemetry path</title>
  <desc id="detail">On Fedora, the dedicated Debian guest sends Auditd, systemd, file integrity, application and Suricata loopback records through the Wazuh agent and the host loopback relay. In a private rootless Podman network, the manager evaluates rules, stores event archives, and ships alerts with Filebeat to the indexer. The dashboard uses the manager API and indexer. The analyst connects to the dashboard over loopback HTTPS.</desc>
