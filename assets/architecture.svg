  <g font-family="system-ui, sans-serif" fill="#f8fafc">
    <text x="38" y="50" font-size="28" font-weight="700">Enterprise SOC telemetry path</text>
    <text x="38" y="78" fill="#a9c1d5" font-size="16">Fedora workstation · Wazuh 4.14.10</text>
    <g fill="#8bdbfa" font-size="17" font-weight="650">
